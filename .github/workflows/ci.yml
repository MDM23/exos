name: CI

on:
  pull_request:
  push:
    branches: [main]

# A push to a branch with an open pull request would otherwise run everything
# twice, and only the newest run of either matters.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Every target, so the tests and the example are linted as the library
      # is. Warnings fail through RUSTFLAGS rather than a lint attribute, which
      # keeps `cargo clippy` locally quiet enough to work in.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features

      # Doc links break silently otherwise, and the guide leans on them.
      - name: Docs
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Kept in step with `rust-version` in the workspace manifest by hand.
      # Raising one without the other is what this job exists to catch.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-features
