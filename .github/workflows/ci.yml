name: CI

on:
  pull_request:
  push:
    branches: [main]

# A push to a branch with an open pull request would otherwise run everything
# twice, and only the newest run of either matters.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every tool comes from the flake, so this runs the compiler a
      # contributor's shell runs and there is one version to raise rather than
      # two that can disagree. Nothing here installs a toolchain of its own.
      - uses: cachix/install-nix-action@v31

      # Keyed on both locks, since a change to either is a different build.
      # rust-cache is the better tool for this and cannot be used: it runs
      # `rustc -vV` to build its key, and rustc only exists inside the shell.
      - uses: actions/cache@v4
        with:
          key: cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          restore-keys: cargo-

      - name: Format
        run: nix develop --command cargo fmt --all --check

      # Every target, so the tests and the examples are linted as the library
      # is. Warnings fail through RUSTFLAGS rather than a lint attribute, which
      # keeps `cargo clippy` locally quiet enough to work in.
      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --all-features

      - name: Test
        run: nix develop --command cargo test --workspace --all-features

      # Doc links break silently otherwise, and the guide leans on them.
      - name: Docs
        run: nix develop --command cargo doc --workspace --all-features --no-deps

  runtime:
    name: Client runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The one place this project needs node, and it comes from the flake like
      # everything else. Applications built with exos need none, which is what
      # the asset pipeline is for; the runtime is the half of the framework
      # `cargo test` cannot reach, and testing a DOM takes one.
      - uses: cachix/install-nix-action@v31

      - name: Install
        run: nix develop --command npm ci

      - name: Test
        run: nix develop --command npm test

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      # The shell reads `rust-version` out of the workspace manifest, so what
      # this builds with is what the manifest claims, with nothing to keep in
      # step by hand. What the job catches is the code quietly needing a newer
      # compiler than either of them says.
      - name: Build
        run: nix develop .#msrv --command cargo build --workspace --all-features
